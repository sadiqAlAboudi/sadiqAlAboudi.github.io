name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Build with Hugo
        run: hugo --gc --minify

      - name: Compile Typst to PDF
        run: |
          # 1. Compile English PDF
          if [ -f public/resume.typ ]; then
            typst compile --font-path fonts public/resume.typ public/resume.pdf
          fi

          # 2. Compile Arabic PDF
          if [ -f public/ar/resume.typ ]; then
            typst compile --font-path fonts public/ar/resume.typ public/ar/resume.pdf
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4