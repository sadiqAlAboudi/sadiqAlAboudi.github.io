experience:
  - role: "أخصائي أنظمة ويب وشبكات"
    organization: "جامعة القادسية"
    period: "أيلول 2024 - حتى الآن"
    team: "عضو لجنة إدارة الموقع الإلكتروني، عضو شعبة صيانة الحاسبات وشبكة المعلومات الداخلية، عضو فريق مركز العمليات الأمنية (SOC)، ومسؤول الدعم الفني لنظام إدارة معلومات الطلبة (SIS) الوزاري في الجامعة."
    highlights:
      - "إدارة منصة Google Workspace المؤسسية وخدمات البريد والأرشفة الداخلية لأكثر من 10,000 حساب مستخدم وما يزيد عن 50 عقدة محلية (On-Premise)."
      - "إعادة بناء وتطوير المواقع الإلكترونية للأقسام باستخدام Hugo و Go، مما رفع درجات أداء Google Lighthouse للهواتف من قرابة 34 إلى أكثر من 97."
      - "معالجة (Switching Loops) عبر بروتوكول Spanning Tree (STP)، وتطبيق الـ (caching/filtering) بواسطة (CoreDNS و Pi-hole)، مما قلص بلاغات أعطال الشبكة من قرابة 3 يومياً إلى أقل من بلاغين لكل ربع سنة."
      - "تطوير منصة استعلامات واستفسارات داخلية باستخدام Go و PocketBase، مع تدابير أمنية مشددة وتحديد لمعدل الطلبات (Rate-Limiting) للخدمة حتى 10,000 جلسة متزامنة بكفاءة."
      - "عضو فاعل في فريق مركز العمليات الأمنية (SOC) للمراقبة وفرز التنبيهات الأمنية وتحليلها."
      - "تقديم الدعم الفني لكافة كوادر وتدريسيي الجامعة العاملين على نظام إدارة معلومات الطلبة (SIS)."

  - role: "أخصائي شبكات وبنية تحتية ميدانية"
    organization: "وكيل مزود خدمة إنترنت (ISP Agent)"
    period: "تشرين الأول 2018 - أيلول 2024"
    team: "عمليات ومزودي الشبكات"
    highlights:
      - "إدارة العمليات والربط اللاسلكي متعدد النقاط (PtMP) عبر 6 أبراج بث (WISP)، مما ساهم في توسيع قاعدة المشتركين بنسبة 190% (من قرابة 120 إلى أكثر من 350 عميلاً)."
      - "تهيئة وتجهيز البنية التحتية للألياف الضوئية للمنازل (FTTH)، وأجهزة المودم الضوئي (ONTs)."
      - "تشخيص ومعالجة أعطال الطبقة المادية وطبقة ربط البيانات في الشبكة لضمان أعلى مستويات توفر الخدمة."

