experience:
  - role: "مسؤول النظم والشبكات والمواقع الإلكترونية"
    organization: "جامعة القادسية"
    period: "أيلول 2024 - حتى الآن"
    team: "شعبة المواقع والبنية التحتية، فريق مركز العمليات الأمنية (SOC) والدعم الفني لنظام (SIS)"
    highlights:
      - "إدارة خدمات Google Workspace المؤسسية وأنظمة البريد والأرشفة الداخلية لأكثر من 10,000 حساب نشط و50+ عقدة عمل محلية."
      - "إعادة بناء وتطوير البوابات الإلكترونية للأقسام باستخدام Hugo وGo، مما رفع تقييم الأداء على Google Lighthouse للهواتف من 34 إلى 97+."
      - "القضاء على الحلقات الشبكية (Switching Loops) عبر بروتوكول STP ونشر خوادم DNS محلية (CoreDNS وPi-hole)، مما خفّض بلاغات الأعطال من ~3 يومياً إلى أقل من بلاغين كل 3 أشهر."
      - "تطوير منصة استعلامات إلكترونية داخلية باستخدام Go وPocketBase، مع تأمينها وتحديد معدل الطلبات (Rate-limiting) لخدمة ما يصل إلى 10,000 جلسة متزامنة بكفاءة."
      - "عضو فعّال في فريق مركز العمليات الأمنية (SOC) لإدارة المراقبة وتحليل التنبيهات، وتقديم الدعم الفني لنظام معلومات الطلبة (SIS)."

  - role: "مختص شبكات وبنية تحتية ميدانية"
    organization: "وكيل مجهز خدمة إنترنت (ISP Agent)"
    period: "تشرين الأول 2018 - أيلول 2024"
    team: "إدارة العمليات والشبكات"
    highlights:
      - "إدارة تشغيل وربط الوصلات اللاسلكية عبر 6 أبراج WISP، والمساهمة في توسيع قاعدة المشتركين بنسبة 190% (من 120 إلى أكثر من 350 مشتركاً)."
      - "تجهيز وتهيئة البنية التحتية للألياف الضوئية للمنازل (FTTH) وأجهزة ONT ومعدات المشتركين مع تحسين مسار الإشارة لتقليل زمن الاستجابة (Latency)."
      - "تشخيص وحل أعطال الطبقات الفيزيائية وربط البيانات (Physical & Data-Link) لضمان استقرار الخدمة وجاهزيتها العالية."

